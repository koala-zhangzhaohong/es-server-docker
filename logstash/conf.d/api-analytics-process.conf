# replace 192.168.1.1 to real server ip
input {
  kafka{
    bootstrap_servers => "192.168.1.1:55009"
    security_protocol => "SASL_PLAINTEXT"
    sasl_mechanism => "PLAIN"
    sasl_jaas_config => "org.apache.kafka.common.security.plain.PlainLoginModule required username='admin' password='superadmin';"
    topics_pattern  => "api-analytics-process.*"
    consumer_threads => 2
    decorate_events => true
    codec => "json"
    auto_offset_reset => "latest"
    group_id => "api-analytics-process"
    client_id => "api-analytics-consumer"
  }
}
filter {
}
output {
  elasticsearch {
    hosts => ["http://192.168.1.1:55005"]
    user => ["elastic"]
    password => ["superadmin"]
    index => "api-analytics-process-%{+YYYY.MM.dd}"
  }
}